name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Device (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Xcode project
        run: |
          xcodebuild -project MiniJump.xcodeproj \
            -scheme MiniJump \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find and package .app bundle
        id: package_ipa
        run: |
          APP_PATH=$(find ./DerivedData -name "MiniJump.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find ./DerivedData -name "*.app" -type d
            exit 1
          fi
          echo "Found .app: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          if [ ! -d "Payload/MiniJump.app" ]; then
            echo "ERROR: IPA structure invalid"
            exit 1
          fi
          
          zip -r MiniJump.ipa Payload
          
          unzip -l MiniJump.ipa | head -20
          
          echo "ipa_path=${PWD}/MiniJump.ipa" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniJump-IPA
          path: ${{ steps.package_ipa.outputs.ipa_path }}
          retention-days: 30

  build-ios-simulator:
    name: Build iOS Simulator (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project MiniJump.xcodeproj \
            -scheme MiniJump \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find and package Simulator .app bundle
        id: package_ipa
        run: |
          APP_PATH=$(find ./DerivedData -name "MiniJump.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find ./DerivedData -name "*.app" -type d
            exit 1
          fi
          echo "Found .app: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          if [ ! -d "Payload/MiniJump.app" ]; then
            echo "ERROR: IPA structure invalid"
            exit 1
          fi
          
          zip -r MiniJump-Simulator.ipa Payload
          
          unzip -l MiniJump-Simulator.ipa | head -20
          
          echo "ipa_path=${PWD}/MiniJump-Simulator.ipa" >> $GITHUB_OUTPUT

      - name: Upload Simulator IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniJump-Simulator-IPA
          path: ${{ steps.package_ipa.outputs.ipa_path }}
          retention-days: 30