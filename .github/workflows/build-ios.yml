name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./minijump

      - name: Validate project
        run: |
          cd minijump
          godot --headless --check-only --quit

  build-ios:
    name: Build iOS
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./minijump

      - name: Install Xcode command line tools
        run: |
          xcode-select --install || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Export iOS project
        run: |
          cd minijump
          godot --headless --export-release "iOS" ../build/ios

      - name: Build IPA with Xcode
        run: |
          cd build/ios
          # Build for device (requires signing) or simulator
          # For unsigned test build, we'll build for simulator and package as IPA
          xcodebuild -project Mini\ Jump.xcodeproj \
            -scheme Mini\ Jump \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA from build
        run: |
          cd build/ios
          mkdir -p Payload
          cp -r build/Release-iphoneos/Mini\ Jump.app Payload/
          zip -r MiniJump.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniJump-IPA
          path: build/ios/MiniJump.ipa
          retention-days: 30

  build-ios-simulator:
    name: Build iOS Simulator (Unsigned)
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./minijump

      - name: Export iOS project
        run: |
          cd minijump
          godot --headless --export-release "iOS" ../build/ios-sim

      - name: Build for iOS Simulator
        run: |
          cd build/ios-sim
          xcodebuild -project Mini\ Jump.xcodeproj \
            -scheme Mini\ Jump \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA for Simulator
        run: |
          cd build/ios-sim
          mkdir -p Payload
          cp -r build/Release-iphonesimulator/Mini\ Jump.app Payload/
          zip -r MiniJump-Simulator.ipa Payload

      - name: Upload Simulator IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniJump-Simulator-IPA
          path: build/ios-sim/MiniJump-Simulator.ipa
          retention-days: 30